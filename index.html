<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>My Palette Gallery</title>
        <link rel="apple-touch-icon" href="icon.png">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#1a1a2e">

    </head>
    <body>
        <h1>My Palette Gallery</h1>
        <p>A collection of my Sims legacy palettes</p>
        <h2>The Sugarspun Tide Legacy</h2>
        <section class="palette"></section>

            <div class="swatch" data-hex="#F3B9CB" style="background-color: #F3B9CB; color: #3a2b35;">
                <p>Red Tilapia</p>
                <p>#F3B9CB</p>
            </div>

            <div class="swatch" data-hex="#FFDCCB" style="background-color: #FFDCCB; color: #3a2b35;">
                <p>Coral Kiss</p>
                <p>#FFDCCB</p>
            </div>

            <div class="swatch" data-hex="#FDF0F9" style="background-color: #FDF0F9; color: #3a2b35;">
                <p>Glazed Sugar</p>
                <p>#FDF0F9</p>
            </div>

            <div class="swatch" data-hex="#AFEBF3" style="background-color: #AFEBF3; color: #3a2b35;">
                <p>Crystal Blue</p>
                <p>#AFEBF3</p>
            </div>

            <div class="swatch" data-hex="#8ED5F3" style="background-color: #8ED5F3; color: #3a2b35;">
                <p>Anakiwa</p>
                <p>#8ED5F3</p>
            </div>

            <div class="swatch" data-hex="#B5A2D4" style="background-color: #B5A2D4; color: #3a2b35;">
                <p>Deluge</p>
                <p>#B5A2D4</p>
            </div>

        <section class="palette"></section>
        </div>

        <script>
            const swatches = document.querySelectorAll('.swatch');

            swatches.forEach(function(swatch){
                swatch.addEventListener('click', function (){
                    const hex = swatch.getAttribute('data-hex');
                    navigator.clipboard.writeText(hex);

                    const originalHTML = swatch.innerHTML;
                    swatch.innerHTML = 'Copied!';

                    setTimeout(function() {
                        swatch.innerHTML = originalHTML;
                    }, 1000);
                });
            });
        </script>
    </body>
</html>
